<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1,user-scalable=no">
    <title>延迟测速面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #eef2ff 100%);
            padding: 12px;
            min-height: 100vh;
        }
        .page-title{
            text-align:center;
            font-size:20px;
            font-weight:700;
            color:#1e293b;
            margin-bottom:14px;
        }
        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 16px;
            max-width: 100%;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .ip-bar {
            font-size: 13px;
            margin-bottom: 14px;
            color: #666;
            line-height: 1.6;
            word-break: break-all;
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
        }

        .ip-bar strong {
            color: #334155;
            font-weight: 600;
        }

        .add-row {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            margin-bottom: 16px;
            align-items: center;
        }

        input {
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 14px;
            background: #fafafa;
            color: #334155;
        }

        #siteName {
            width: 96px;
            flex-shrink: 0;
        }

        #siteUrl {
            flex: 1;
            min-width: 0;
        }

        select {
            padding: 9px 10px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            font-size: 13px;
            flex-shrink: 0;
            background: #fafafa;
            color: #334155;
        }

        button {
            padding: 9px 14px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #4070f4 0%, #2563eb 100%);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(64, 112, 244, 0.35);
        }

        button:active {
            transform: scale(0.96);
        }

        .item {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 4px;
            border-bottom: 1px solid #f1f5f9;
            flex-wrap: nowrap;
        }

        .item:last-child {
            border-bottom: none;
        }

        .icon-img {
            width: 24px;
            height:24px;
            flex-shrink: 0;
            border-radius:6px;
            object-fit:cover;
        }

        .name {
            width: 74px;
            flex-shrink: 0;
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #334155;
        }

        .tag {
            width: 54px;
            padding: 2px 4px;
            border-radius: 999px;
            font-size: 11px;
            text-align: center;
            flex-shrink: 0;
            font-weight: 500;
        }

        .tag-cn {
            background: #e6ecff;
            color: #3b59b3;
        }

        .tag-intl {
            background: #e2f4ed;
            color: #278c6c;
        }

        .ms {
            width: 66px;
            font-size: 16px;
            font-weight: 700;
            text-align: right;
            flex-shrink: 0;
        }

        .dot-group {
            display: flex;
            gap: 3px;
            flex: 1;
            min-width: 90px;
            justify-content: flex-start;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e2e8f0;
            flex-shrink: 0;
        }

        .green { background-color: #22c55e; }
        .yellow { background-color: #f59e0b; }
        .red { background-color: #ef4444; }
    </style>
</head>
<body>
<div class="page-title">网页延迟测试工具</div>
<div class="card" id="mainCard">
    <div class="ip-bar">
        IP：<span id="clientIp"><strong>加载中...</strong></span>
        &nbsp;|&nbsp;位置：<span id="location"><strong>加载中...</strong></span>
    </div>

    <div class="add-row">
        <input id="siteName" placeholder="站点名称"/>
        <input id="siteUrl" placeholder="域名"/>
        <select id="siteTag">
            <option value="国内">国内</option>
            <option value="国际">国际</option>
        </select>
        <button id="addBtn">添加</button>
    </div>

    <div id="listWrap"></div>
</div>

<script>
let siteList = [
    {name:"和平精英",tag:"国内",url:"https://gp.qq.com/favicon.ico",icon:"https://gp.qq.com/favicon.ico"},
    {name:"Bilibili",tag:"国内",url:"https://www.bilibili.com/favicon.ico",icon:"https://www.bilibili.com/favicon.ico"},
    {name:"王者荣耀",tag:"国内",url:"https://pvp.qq.com/favicon.ico",icon:"https://pvp.qq.com/favicon.ico"},
    {name:"淘宝",tag:"国内",url:"https://www.taobao.com/favicon.ico",icon:"https://www.taobao.com/favicon.ico"},
    {name:"GitHub",tag:"国际",url:"https://github.com/favicon.ico",icon:"https://github.com/favicon.ico"},
    {name:"纸飞机",tag:"国际",url:"https://telegram.org/favicon.ico",icon:"https://telegram.org/favicon.ico"},
    {name:"Cloudflare",tag:"国际",url:"https://www.cloudflare.com/favicon.ico",icon:"https://www.cloudflare.com/favicon.ico"},
    {name:"YouTube",tag:"国际",url:"https://www.youtube.com/favicon.ico",icon:"https://www.youtube.com/favicon.ico"},
    {name:"GPT-OpenAI",tag:"国际",url:"https://openai.com/favicon.ico",icon:"https://openai.com/favicon.ico"},
    {name:"X(Twitter)",tag:"国际",url:"https://x.com/favicon.ico",icon:"https://x.com/favicon.ico"}
];

const listWrap = document.getElementById("listWrap");
const siteName = document.getElementById("siteName");
const siteUrl = document.getElementById("siteUrl");
const siteTag = document.getElementById("siteTag");
const addBtn = document.getElementById("addBtn");
const clientIpEl = document.getElementById("clientIp");
const locationEl = document.getElementById("location");

(async function getIpInfo(){
  try{
    const res = await fetch("https://api.ip.sb/geoip");
    const json = await res.json();
    clientIpEl.innerText = json.ip;
    locationEl.innerText = `${json.country} ${json.city||""}`;
  }catch(e){
    clientIpEl.innerText = "获取失败";
    locationEl.innerText = "获取失败";
  }
})();

function renderList(){
    listWrap.innerHTML = "";
    siteList.forEach((site,idx)=>{
        const tagClass = site.tag === "国内" ? "tag-cn":"tag-intl";
        listWrap.innerHTML += `
        <div class="item" data-idx="${idx}">
            <img class="icon-img" src="${site.icon}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🌐</text></svg>'">
            <div class="name" title="${site.name}">${site.name}</div>
            <div class="tag ${tagClass}">${site.tag}</div>
            <div class="ms" data-ms>--</div>
            <div class="dot-group" data-dot>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>`;
    });
}

async function testLatency(index,imgUrl){
    const itemDom = document.querySelector(`[data-idx="${index}"]`);
    if(!itemDom) return;

    const msDom = itemDom.querySelector("[data-ms]");
    const dots = itemDom.querySelectorAll(".dot");
    const startTime = performance.now();
    let cost = -1;

    return new Promise(resolve=>{
        const img = new Image();
        let timer = setTimeout(()=>{
            img.onload=null;
            img.onerror=null;
            cost = -1;
            render();
            resolve();
        },2500);

        img.onload = ()=>{
            clearTimeout(timer);
            cost = Math.round(performance.now() - startTime);
            render();
            resolve();
        };

        img.onerror = ()=>{
            clearTimeout(timer);
            cost = -1;
            render();
            resolve();
        };

        img.src = imgUrl + "?t="+Date.now();

        function render(){
            msDom.innerText = cost === -1 ? "-1ms" : `${cost}ms`;

            let activeDot = 0;
            let colorClass = "red";

            if(cost !== -1){
                if(cost < 80){
                    colorClass = "green";
                    activeDot = 8;
                }else if(cost <= 200){
                    colorClass = "yellow";
                    activeDot = Math.min(8, Math.ceil(cost / 25));
                }else{
                    colorClass = "red";
                    activeDot = Math.min(8, Math.ceil((cost - 200) / 50));
                }
            }

            dots.forEach((d,i)=>{
                d.className = i < activeDot ? `dot ${colorClass}` : "dot";
            });

            if(cost === -1){
                msDom.style.color = "#ef4444";
            }else if(cost < 80){
                msDom.style.color = "#22c55e";
            }else{
                msDom.style.color = "#f59e0b";
            }
        }
    });
}

async function batchPingAll(){
    const tasks = siteList.map((site,i)=> testLatency(i, site.url));
    await Promise.all(tasks);
    setTimeout(batchPingAll, 5);
}

addBtn.onclick = ()=>{
    const n = siteName.value.trim();
    const u = siteUrl.value.trim();
    const t = siteTag.value;
    if(!n || !u) return;
    siteList.push({name:n, tag:t, url:u, icon:u});
    siteName.value = "";
    siteUrl.value = "";
    renderList();
};

renderList();
batchPingAll();
</script>
</body>
    </html>
